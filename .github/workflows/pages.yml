name: Publish Velscour PC to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published revision
        uses: actions/checkout@v4
      - name: Prepare fresh, commit-stamped site
        run: python3 tools/pages_build.py /tmp/velscour-pages "${{ github.sha }}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/velscour-pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
